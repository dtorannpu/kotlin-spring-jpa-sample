name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distribution: ["temurin"]
        java-version: ["25"]
    steps:
      - name: Java version
        env:
          JAVA_VERSION: ${{ matrix.java-version }}
        run: echo $JAVA_VERSION
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up JDK ${{ matrix.distribution }} ${{ matrix.java-version }}
        uses: actions/setup-java@v6.1.0
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java-version }}
          cache: "gradle"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Check
        run: ./gradlew check
